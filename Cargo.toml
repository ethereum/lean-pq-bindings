[workspace]
members = [
    "bindings/python",
    "bindings/native",
    "bindings/node",
    "bindings/rust",
    "benchmarks/comparison",
]
resolver = "2"

[workspace.package]
# The release version of every binding; release-please updates it.
version = "0.9.0"

[workspace.dependencies]
# `leanvm` and `signatures` must name the same revision: `signatures` is the leanXMSS/leanSPHINCS
# crate inside leanVM, which `leanvm` re-exports alongside the aggregation prover.
leanvm = { git = "https://github.com/leanEthereum/leanVM.git", rev = "ed7d2b9c19c8f405d4f9c2d410ac4441b96c0e6b" }
signatures = { git = "https://github.com/leanEthereum/leanVM.git", rev = "ed7d2b9c19c8f405d4f9c2d410ac4441b96c0e6b" }
lean-pq = { path = "bindings/rust" }

[profile.release]
lto = "thin"
codegen-units = 1
