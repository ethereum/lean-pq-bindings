[workspace]
members = [
    "bindings/python",
    "bindings/native",
    "bindings/node",
    "bindings/rust",
    "benchmarks/comparison",
]
resolver = "2"

[workspace.package]
# The release version of every binding; release-please updates it.
version = "0.9.0"

[workspace.dependencies]
# `leanvm` and `signatures` must name the same revision: `signatures` is the leanXMSS/leanSPHINCS
# crate inside leanVM, which `leanvm` re-exports alongside the aggregation prover.
leanvm = { git = "https://github.com/leanEthereum/leanVM.git", rev = "a39758de10f35c7b34023d061cc05dfc0b36d43a" }
signatures = { git = "https://github.com/leanEthereum/leanVM.git", rev = "a39758de10f35c7b34023d061cc05dfc0b36d43a" }
rand = "0.9"
lean-pq = { path = "bindings/rust" }

[profile.release]
lto = "thin"
codegen-units = 1
