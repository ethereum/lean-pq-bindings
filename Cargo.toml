[workspace]
members = [
    "bindings/python",
    "bindings/native",
    "bindings/node",
    "bindings/rust",
    "benchmarks/comparison",
]
resolver = "2"

[workspace.dependencies]
leanvm = { git = "https://github.com/leanEthereum/leanVM.git", rev = "a39758de10f35c7b34023d061cc05dfc0b36d43a" }
lean-pq = { path = "bindings/rust" }

[profile.release]
lto = "thin"
codegen-units = 1
