[package]
name = "lean-pq-comparison"
version.workspace = true
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
lean-pq = { path = "../../bindings/rust" }
lighthouse-bls = { package = "bls", git = "https://github.com/sigp/lighthouse.git", rev = "e423a66763bb1bd780492d635123f208d80c3538" }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Upstream mock leanXMSS keys, real over a short leaf range, for untimed fixture signers.
signatures = { git = "https://github.com/leanEthereum/leanVM.git", rev = "ed7d2b9c19c8f405d4f9c2d410ac4441b96c0e6b", features = ["mock"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "comparison"
harness = false
