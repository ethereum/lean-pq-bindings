name: CI

on:
  push:
    branches: [main, java-windows]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check benchmark workflow policy
        run: sh scripts/check-benchmark-ci.sh

      - name: Check formatting
        run: cargo fmt --check

      # Debug builds of leanVM prove roughly 30x slower, so tests build in release.
      - name: Test Rust bindings
        run: cargo test --release -p lean-pq

      - name: Lint Rust bindings
        run: cargo clippy --release -p lean-pq --all-targets -- -D warnings

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v7

      # rust-toolchain.toml pins the rustc version; this action honors it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Create virtualenv
        run: uv venv
        working-directory: bindings/python

      - name: Build + install (release, with dev extras)
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release --extras dev
          working-directory: bindings/python
          sccache: true

      - name: Run tests
        run: uv run --extra dev pytest tests/ -v
        working-directory: bindings/python

      - name: Check type stubs match runtime
        run: uv run --extra dev python -m mypy.stubtest py_lean_pq --allowlist stubtest_allowlist.txt
        working-directory: bindings/python

  java:
    name: Java 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the native ABI
        run: cargo test --release -p lean-pq-native --test abi

      - name: Test Java bindings
        run: gradle -p bindings/java test

      # Publishes the jar (bundling the host-built library) to a throwaway Maven repository and runs a
      # fresh modular consumer of io.github.crate-crypto:lean-pq without lean.pq.native.path.
      - name: Run a Maven consumer of the Java bindings
        run: sh bindings/java/scripts/consumer-smoke.sh

  # The release's Windows build: x86_64-pc-windows-gnu, checked to import only DLLs Windows ships,
  # then loaded from the jar through the per-user cache by a fresh modular consumer.
  java-windows:
    name: Java 25 / Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the Windows native library
        run: sh bindings/java/scripts/build-native.sh windows-x86_64 native

      - name: Run a Maven consumer of the Java bindings
        run: sh bindings/java/scripts/consumer-smoke.sh -PleanPqNativeDir="$GITHUB_WORKSPACE/native"

  node:
    name: Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and test Node bindings
        run: |
          npm ci
          npm run build
          npm test
        working-directory: bindings/node

      # napi generates index.js, index.d.ts and the per-platform npm/ packages; they must be committed.
      - name: Check generated Node files are committed
        run: |
          npx napi create-npm-dirs
          git status --porcelain -- index.js index.d.ts npm
          test -z "$(git status --porcelain -- index.js index.d.ts npm)"
        working-directory: bindings/node

      # Packs the root and host platform packages, installs both tarballs into a fresh project and
      # signs and verifies through the installed copy. Nothing is published.
      - name: Pack and install Node packages
        run: |
          pack="$RUNNER_TEMP/npm-pack"
          mkdir -p "$pack"
          cp lean_pq_node.linux-x64-gnu.node npm/linux-x64-gnu/
          npm pack --ignore-scripts --pack-destination "$pack"
          npm pack --ignore-scripts --pack-destination "$pack" ./npm/linux-x64-gnu
          sh scripts/install-check.sh "$pack/kevaundray-lean-pq-0.0.0-dev.tgz" "$pack/kevaundray-lean-pq-linux-x64-gnu-0.0.0-dev.tgz"
        working-directory: bindings/node

  zig:
    name: Zig / ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            runner: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            bundle_dir: x86_64-linux-gnu
          - name: macOS universal
            runner: macos-14
            rust_targets: x86_64-apple-darwin aarch64-apple-darwin
            target: universal2-apple-darwin
            bundle_dir: universal-macos
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Add Rust target support
        run: rustup target add ${{ matrix.platform.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Stage static native bridge
        run: |
          sh bindings/native/scripts/stage-static.sh ${{ matrix.platform.target }} bindings/zig/.native
          cmp bindings/native/include/lean_pq_native.h bindings/zig/include/lean_pq_native.h

      - name: Install Zig 0.16.0 for Zig tests
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test Zig bindings
        run: zig build test -Dnative-dir=.native
        working-directory: bindings/zig

      - name: Package and consume the Zig release tarball
        run: |
          mkdir -p "$RUNNER_TEMP/native/${{ matrix.platform.bundle_dir }}"
          cp bindings/zig/.native/liblean_pq_native.a "$RUNNER_TEMP/native/${{ matrix.platform.bundle_dir }}/"
          sh bindings/zig/scripts/package.sh 0.0.0 "$RUNNER_TEMP/native" "$RUNNER_TEMP/lean-pq-zig.tar.gz"
          sh bindings/zig/scripts/consumer-smoke.sh "$RUNNER_TEMP/lean-pq-zig.tar.gz"

  go:
    name: Go cgo / ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux amd64
            runner: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            archive_dir: bindings/go/internal/native/linux_amd64
            go_test_command: go test ./...
          - name: Linux arm64
            runner: ubuntu-latest
            rust_targets: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
            archive_dir: bindings/go/internal/native/linux_arm64
            go_test_command: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC="zig cc -target aarch64-linux-gnu" go test -c -o /tmp/leanpq-arm64.test .
          - name: macOS universal
            runner: macos-14
            rust_targets: x86_64-apple-darwin aarch64-apple-darwin
            target: universal2-apple-darwin
            archive_dir: bindings/go/internal/native/darwin_universal
            go_test_command: go test ./...
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Go native build configuration
        run: |
          sh bindings/native/scripts/stage-static-test.sh
          sh bindings/go/native-platform-test.sh
          sh scripts/check-go-ci.sh

      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.mod

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Add Rust target support
        run: rustup target add ${{ matrix.platform.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Stage static native bridge
        run: |
          sh bindings/native/scripts/stage-static.sh ${{ matrix.platform.target }} ${{ matrix.platform.archive_dir }}
          cmp bindings/native/include/lean_pq_native.h bindings/go/internal/native/include/lean_pq_native.h

      - name: Check universal macOS archive slices
        if: matrix.platform.target == 'universal2-apple-darwin'
        run: lipo bindings/go/internal/native/darwin_universal/liblean_pq_native.a -verify_arch arm64 x86_64

      - name: Test Go bindings
        run: ${{ matrix.platform.go_test_command }}
        working-directory: bindings/go
